<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>INDEX04</title>
</head>
<body>
    <!-- 양식 태그(form tag),   
    form action : 서버 URL
    method : get(클라이언트에서 서버로 데이터를 전송(request)할때 도메인 뒤에 검색어를 붙여서/상대적으로 보안에 상관없는 정보)
    method : post(클라이언트에서 서버로 데이터를 전송(request)하는 프로그램에 데이터가 포함되서 전송/
                  보안이 중요한 파일, 파일이 포함되면 무조건 post)
    <form action\"서버 url"
    <form method="get"
    <form method="post"
      input : 입력창-->
    <form action="서버 URL"
          method="get">
        <input type="text" placeholder="ID를 입력하세요"><br>
        <input type="password" placeholder="PW를 입력하세요"><br>
        <input type="email" placeholder="E-mail을 입력하세요"><br>
        <input type="number" placeholder="AGE를 입력하세요"><br>
        <input type="file"><br>
        <input type="date"><br>
        <input type="datetime-local"><br>
        <select>
            <option>한국</option>
            <option>일본</option>
            <option>영국</option>
            <option>미국</option>
        </select><br>
        <input type="checkbox" name="hobby">축구
        <input type="checkbox" name="hobby">야구
        <input type="checkbox" name="hobby">농구
        <input type="checkbox" name="hobby">수영
        <input type="checkbox" name="hobby">족구<br>
        <input type="radio" name="gender">남자
        <input type="radio" name="gender">여자<br>   
        <input type="color"><br>
        <input type="range" max="10" min="0" step="2" value="4"><br>  
        <input type="button" value="회원가입"> 
        <input type="reset" value="초기화"> <br>
        <textarea></textarea>       
    </form>
</body>
</html>
