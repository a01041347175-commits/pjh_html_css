<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>INDEX03</title>
</head>
<body>
    <!-- ul, ol, li : 목록(리스트)
     ul : unorder list
     ol : order list
     dl, dt, dd -->
     <ul>
        <li>짜장면 </li>
        <li>짬뽕</li>
        <li>우동</li>
        <li>탕수육</li>
     </ul>
     <ol>
        <li>짜장면 </li>
        <li>짬뽕</li>
        <li>우동</li>
        <li>탕수육</li>
     </ol>
     <dl>
        <dt>HTML</dt>
    <dd>웹 문서를 구조화하는 마크업 언어</dd>
</dl>
<dl>
        <dt>CSS</dt>
    <dd>웹 문서를 디자인을 담당하는 스타일 시트 언어</dd>
</dl>

</body>
</html>
